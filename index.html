    if (e.target.getAttribute && e.target.getAttribute('data-f') === 'look.dim') document.documentElement.style.setProperty('--wdim', e.target.value + '%');
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'wallFile' && e.target.files && e.target.files[0]) setWall(e.target.files[0]);
  });
  app.addEventListener('focusout', function () { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });
  app.addEventListener('click', function (e) {
    const t = e.target.closest('[data-a]'); if (!t) return;
    const a = t.getAttribute('data-a'), id = t.getAttribute('data-id'), s = state.settings;
    if (a === 'm-' || a === 'm+') { ui.month = L.shiftMonth(ui.month, a === 'm-' ? -1 : 1); ui.sel = ui.del = null; render(); }
    else if (a.indexOf('go:') === 0) { ui.tab = a.slice(3); ui.tipTopic = null; ui.sel = ui.del = null; render(); window.scrollTo(0, 0); }
    else if (a === 'sel') { ui.sel = ui.sel === id ? null : id; ui.del = null; render(); }
    else if (a === 'del') { ui.del = id; render(); }
    else if (a === 'delno') { ui.del = null; render(); }
    else if (a === 'delyes') { const deleted = delTx(id, t.getAttribute('data-mk')); ui.sel = ui.del = null; render(); if (deleted) toast('Запись удалена.'); }
    else if (a === 'edit') { ui.edit = !ui.edit; render(); }
    else if (a === 'cedit') { ui.creditEdit = !ui.creditEdit; render(); }
    else if (a === 'pay') openSheet({ type: 'p' });
    else if (a === 'savebtn') openSheet({ type: 's' });
    else if (a === 'accsel') { ui.accEdit = ui.accEdit === id ? null : id; ui.accDel = null; render(); }
    else if (a === 'accadd') {
      const nid = 'a' + Date.now().toString(36);
      const usedC = s.accounts.map(function (x) { return x.color; });
      const freeC = L.ACC_COLORS.filter(function (c) { return usedC.indexOf(c) < 0; })[0] || L.ACC_COLORS[s.accounts.length % L.ACC_COLORS.length];
      s.accounts.push({ id: nid, name: 'Новая карта', kind: 'debit', start: 0, cashback: 0, round: false, color: freeC });
      ui.accEdit = nid; Store.saveSettings(); render();
    }
    else if (a === 'acccolor') { const ac = accById(id); if (ac) { ac.color = t.getAttribute('data-c'); Store.saveSettings(); render(); } }
    else if (a.indexOf('lookmode:') === 0) { s.look.mode = a.slice(9); Store.saveSettings(); render(); }
    else if (a.indexOf('lookacc:') === 0) { s.look.accent = a.slice(8); Store.saveSettings(); render(); }
    else if (a === 'wallclear') { try { localStorage.removeItem(WKEY); } catch (er) { /* ничего */ } wallData = null; render(); toast('Обои убраны.'); }
    else if (a === 'topic') { ui.tipTopic = id || null; ui.tipOpen = null; render(); window.scrollTo(0, 0); }
    else if (a === 'tipopen') { ui.tipOpen = ui.tipOpen === id ? null : id; render(); }
    else if (a === 'tipck') { if (s.tips[id]) delete s.tips[id]; else s.tips[id] = true; Store.saveSettings(); render(); }
    else if (a === 'wishadd') {
      const name = $('#wName').value.trim(), amt = L.parseMoney($('#wAmt').value);
      if (!name || isNaN(amt) || amt <= 0) { toast('Введите название и цену, например 3500.'); return; }
      s.wishes.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ts: Date.now(), name: name, a: amt, st: 'w' });
      if (s.wishes.length > 200) s.wishes = s.wishes.slice(-200);
      Store.saveSettings(); render(); toast(L.pauseHours(amt) ? 'Записано. Вернитесь через ' + L.pauseHours(amt) + ' ч.' : 'Записано.');
    }
    else if (a === 'wishdrop') {
      const w = s.wishes.filter(function (x) { return x.id === id; })[0];
      if (w) { w.st = 'c'; Store.saveSettings(); render(); toast('Отлично! Сэкономлено ' + fmt(w.a, w.a % 100 !== 0)); }
    }
    else if (a === 'wishbuy') {
      const w = s.wishes.filter(function (x) { return x.id === id; })[0];
      if (w) {
        w.st = 'b'; Store.saveSettings(); render(); openSheet();
        if (sh) { $('#shAmount').value = (w.a / 100).toFixed(2).replace('.', ','); $('#shNote').value = w.name; updatePreview(); }
      }
    }
    else if (a === 'accround') { const ac = accById(id); if (ac) { ac.round = !ac.round; Store.saveSettings(); render(); } }
    else if (a === 'accdel') { ui.accDel = id; render(); }
    else if (a === 'accdelno') { ui.accDel = null; render(); }
    else if (a === 'accdelyes') {
      if (!L.accountUsed(state.months, id) && s.accounts.length > 1) {
        s.accounts = s.accounts.filter(function (x) { return x.id !== id; });
        if (s.lastAcc === id) s.lastAcc = s.accounts[0].id;
        ui.accEdit = ui.accDel = null; Store.saveSettings(); render(); toast('Счёт удалён.');
      }
    }
    else if (a === 'skipsetup') { s.setupDone = true; Store.saveSettings(); render(); }
    else if (a === 'setup') {
      const v = function (sel) { const x = $(sel).value.trim(); return x === '' ? 0 : L.parseMoney(x); };
      const sal = v('#su-sal'), st = v('#su-st'), ex = v('#su-ex'), cb = v('#su-cb'), card = v('#su-card'), cashv = v('#su-cash');
      if ([sal, st, ex, cb, card, cashv].some(isNaN)) { $('#suErr').textContent = 'Проверьте суммы: только цифры, например 45000 или 15103,07.'; return; }
      s.income.salary = sal; s.income.stipend = st; s.income.extra = ex;
      const main = accById('main') || s.accounts.filter(function (x) { return x.kind !== 'cash'; })[0];
      const cashAcc = accById('cash') || s.accounts.filter(function (x) { return x.kind === 'cash'; })[0];
      if (main) main.start = card - L.accountNet(state.months, main.id);
      if (cashAcc) cashAcc.start = cashv - L.accountNet(state.months, cashAcc.id);
      if (cb > 0) { s.credit.balance = cb; s.credit.setAt = Date.now(); const dd = $('#su-cd').value; s.credit.due = /^\d{4}-\d{2}-\d{2}$/.test(dd) ? dd : ''; }
      s.setupDone = true; Store.saveSettings(); render(); toast('Настройка сохранена.');
    }
    else if (a === 'bkcopy') {
      const json = JSON.stringify({ v: 2, settings: state.settings, months: state.months });
      const manual = function () { const ta = $('#bkText'); ta.value = json; ta.focus(); ta.select(); toast('Скопируйте выделенный текст вручную.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function () { toast('Копия скопирована. Сохраните её в заметках.'); }, manual); else manual();
    }
    else if (a === 'bkrestore') {
      let d; try { d = JSON.parse($('#bkText').value.trim()); } catch (er) { toast('Не удалось прочитать копию.'); return; }
      const restored = L.validateBackup(d);
      if (!restored) { toast('Копия повреждена или имеет неподдерживаемый формат. Текущие данные не изменены.'); return; }
      state.settings = restored.settings; state.months = restored.months;
      Store.saveSettings(); Object.keys(restored.months).forEach(function (k) { Store.saveMonth(k); });
      render(); toast('Данные восстановлены.');
    }
  });
  $('#nav').addEventListener('click', function (e) {
    const t = e.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-open')) { openSheet(); return; }
    const tab = t.getAttribute('data-tab');
    if (tab) { ui.tab = tab; ui.sel = ui.del = null; render(); window.scrollTo(0, 0); }
  });
  sheet.addEventListener('click', function (e) {
    const t = e.target.closest('[data-s]'); if (!t || !sh) return;
    const a = t.getAttribute('data-s');
    if (a === 'close') closeSheet();
    else if (a === 'save') saveSheet();
    else if (a.indexOf('type:') === 0) setType(a.slice(5));
    else if (a.indexOf('cat:') === 0) { sh.cat = a.slice(4); drawDyn(); updatePreview(); $('#shErr').textContent = ''; }
    else if (a.indexOf('acc:') === 0) {
      sh.acc = a.slice(4);
      const ac = accById(sh.acc); sh.round = !!(ac && ac.round);
      if (sh.type === 't' && sh.to === sh.acc) sh.to = otherAcc(sh.acc);
      drawDyn(); updatePreview();
    }
    else if (a.indexOf('to:') === 0) {
      sh.to = a.slice(3);
      if (sh.to === sh.acc) sh.acc = otherAcc(sh.to);
      drawDyn(); updatePreview();
    }
    else if (a === 'round') { sh.round = !sh.round; drawDyn(); updatePreview(); }
    else if (a.indexOf('reg:') === 0) { sh.reg = true; sh.regName = a.slice(4); $('#shNote').value = sh.regName === 'Другое регулярное' ? '' : sh.regName; drawDyn(); }
    else if (a.indexOf('once:') === 0) { sh.reg = false; sh.regName = a.slice(5); $('#shNote').value = a.slice(5); drawDyn(); }
    else if (a === 'full') { const d = L.creditDebt(state.months, state.settings); $('#shAmount').value = (d / 100).toFixed(2).replace('.', ','); updatePreview(); }
  });
  sheet.addEventListener('input', function (e) { if (e.target.id === 'shAmount') { $('#shErr').textContent = ''; updatePreview(); } else if (e.target.id === 'shDate') updatePreview(); });
  sheet.addEventListener('change', function (e) { if (e.target.id === 'shDate') updatePreview(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sh) closeSheet(); });

  render();
  Store.init(refresh);
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
