<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Баланс">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Баланс месяца</title>

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Концепция: один столбец до 520px, сверху главное число «можно потратить»,
   внизу навигация с центральной кнопкой «+». Единственный яркий блок — главная карточка. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E7ECE9; --fg:#12201B; --muted:#5C6B64; --line:#D5DDD8;
  --accent:#0B6E5E; --accent-fg:#FFFFFF; --accent-soft:#D6ECE5;
  --hero-track:rgba(255,255,255,.24); --hero-fill:#FFFFFF; --hero-sub:rgba(255,255,255,.82);
  --good:#1D7A4B; --good-soft:#DAF0E3; --warn:#8F5400; --warn-soft:#F8E8C8; --bad:#B0322A; --bad-soft:#F8DCD8;
  --need:#3D6DB4; --want:#B7791F; --save:#0B6E5E;
  --font-display:'Unbounded','Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --surface:#151F1B; --surface-2:#1E2B26; --fg:#E8EFEB; --muted:#93A59B; --line:#27362F;
    --accent:#3FBFA6; --accent-fg:#06251F; --accent-soft:#143A32;
    --hero-track:rgba(6,37,31,.28); --hero-fill:#06251F; --hero-sub:rgba(6,37,31,.78);
    --good:#4CC58A; --good-soft:#15362A; --warn:#E3A944; --warn-soft:#3A2D12; --bad:#F0766D; --bad-soft:#40201D;
    --need:#7FA6E0; --want:#E0A857; --save:#3FBFA6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1B; --surface-2:#1E2B26; --fg:#E8EFEB; --muted:#93A59B; --line:#27362F;
  --accent:#3FBFA6; --accent-fg:#06251F; --accent-soft:#143A32;
  --hero-track:rgba(6,37,31,.28); --hero-fill:#06251F; --hero-sub:rgba(6,37,31,.78);
  --good:#4CC58A; --good-soft:#15362A; --warn:#E3A944; --warn-soft:#3A2D12; --bad:#F0766D; --bad-soft:#40201D;
  --need:#7FA6E0; --want:#E0A857; --save:#3FBFA6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 112px;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
input,select{font:inherit; color:var(--fg)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1,h2,h3{margin:0; font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500}

/* переключатель месяца */
.mswitch{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px}
.mswitch h1{font-family:var(--font-display); font-size:17px; font-weight:500; text-align:center; flex:1}
.iconbtn{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line)}
.iconbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* карточки */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.card h2{font-size:16px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid2 > *{min-width:0}
@media (max-width:360px){ .grid2{grid-template-columns:1fr} }
.link{color:var(--accent); font-weight:500; text-align:left}

/* главная карточка */
.hero{background:var(--accent); color:var(--accent-fg); border-radius:22px; padding:20px; display:flex; flex-direction:column; gap:14px}
.hero .label{color:var(--hero-sub)}
.hero .big{font-family:var(--font-display); font-weight:600; font-size:34px; line-height:1.1; letter-spacing:-.01em}
.hero .sub{color:var(--hero-sub); font-size:14px}
.hero .big.neg{font-size:30px}
.track{position:relative; height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden}
.hero .track{background:var(--hero-track); overflow:visible}
.fill{height:100%; border-radius:6px; background:var(--accent)}
.hero .fill{background:var(--hero-fill)}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--hero-fill); border-radius:1px; opacity:.9}

.stat{font-family:var(--font-display); font-weight:500; font-size:20px; line-height:1.15; overflow-wrap:anywhere}
.stat.bad{color:var(--bad)}

/* плашки статуса */
.pill{display:inline-flex; align-items:center; font-size:12px; font-weight:500; padding:3px 9px; border-radius:999px; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.idle{background:var(--surface-2); color:var(--muted)}
.alerts{display:flex; flex-wrap:wrap; gap:8px}

/* списки */
.list{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); text-align:left; width:100%}
.row:first-child{border-top:0; padding-top:0}
.row:last-child{padding-bottom:0}
.dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--muted)}
.dot.need{background:var(--need)} .dot.want{background:var(--want)} .dot.save{background:var(--save)} .dot.inc{background:var(--good)} .dot.pay{background:var(--bad)}
.row .main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.row .t{font-weight:500; overflow-wrap:anywhere}
.row .amt{font-weight:600; text-align:right; white-space:nowrap}
.row .amt.in{color:var(--good)}
.tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; background:var(--warn-soft); color:var(--warn); margin-left:6px; vertical-align:middle}
.tag.soft{background:var(--accent-soft); color:var(--accent)}
.daytitle{font-size:13px; color:var(--muted); font-weight:500; margin:2px 0 0}
.actions{display:flex; gap:8px; flex-wrap:wrap; padding:0 0 12px 22px}
.empty{padding:20px 4px; text-align:center; color:var(--muted)}

/* бюджет */
.cat{display:flex; flex-direction:column; gap:8px; padding:12px 0; border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .head{display:flex; align-items:center; gap:10px; justify-content:space-between}
.cat .head .n{display:flex; align-items:center; gap:8px; min-width:0; font-weight:500}
.cat .figs{display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted)}
.grouphead{display:flex; justify-content:space-between; align-items:baseline; gap:8px}

/* формы */
.field{display:flex; flex-direction:column; gap:6px}
.field label,.field .lab{font-size:13px; color:var(--muted); font-weight:500}
.inp{width:100%; min-height:46px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--fg)}
.inp.sm{min-height:40px; width:92px; text-align:right; padding:6px 10px}
.formrow{display:flex; align-items:center; justify-content:space-between; gap:12px}
.formrow > span{min-width:0}
.btn{min-height:48px; padding:0 18px; border-radius:14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.primary{background:var(--accent); color:var(--accent-fg)}
.btn.ghost{background:var(--surface); border:1px solid var(--line)}
.btn.danger{background:var(--bad); color:#fff}
.btn.sm{min-height:36px; padding:0 14px; font-size:14px; border-radius:11px}
.btn.block{width:100%}
.hint{font-size:13px; padding:10px 12px; border-radius:12px; background:var(--surface-2); color:var(--fg)}
.hint.warn{background:var(--warn-soft); color:var(--warn)}
.hint.bad{background:var(--bad-soft); color:var(--bad)}
.hint.good{background:var(--good-soft); color:var(--good)}
.switch{position:relative; width:50px; height:30px; border-radius:16px; background:var(--surface-2); border:1px solid var(--line); flex:none; transition:background .15s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:transform .15s, background .15s}
.switch.on{background:var(--accent); border-color:var(--accent)}
.switch.on::after{transform:translateX(20px); background:var(--accent-fg)}

/* сегментированный выбор и чипы */
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--surface-2); border-radius:14px; padding:4px; gap:4px}
.seg button{min-height:40px; border-radius:10px; font-size:13px; font-weight:500; color:var(--muted); padding:0 4px}
.seg button.on{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--surface); font-size:14px}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600}

/* нижняя навигация */
#nav{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
#nav .in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr 76px 1fr 1fr; align-items:end}
#nav [data-tab]{display:flex; flex-direction:column; align-items:center; gap:2px; min-height:52px; justify-content:center; font-size:11px; color:var(--muted); font-weight:500}
#nav [data-tab].on{color:var(--accent)}
#nav svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
#nav .add{justify-self:center; width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center; margin-top:-22px; box-shadow:0 6px 16px rgba(0,0,0,.22)}
#nav .add svg{width:26px; height:26px; stroke-width:2.4}

/* окно добавления */
#sheet{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#sheet .in{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
#sheet .top{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px}
#sheet h2{font-family:var(--font-display); font-weight:500; font-size:17px}
.amount{font-family:var(--font-display); font-size:32px; font-weight:600; min-height:64px; text-align:left}
.amountwrap{position:relative}
.amountwrap .cur{position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; color:var(--muted); pointer-events:none}
.err{color:var(--bad); font-size:13px; min-height:18px}

#toast{position:fixed; left:max(16px, env(safe-area-inset-left, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(92px + env(safe-area-inset-bottom, 0px)); z-index:60;
  max-width:480px; margin:0 auto; background:var(--fg); color:var(--bg); padding:12px 16px; border-radius:14px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

.editbox{background:var(--surface-2); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; margin:4px 0 10px}
.editbox .inp{background:var(--surface)}
.dot.xfer{background:var(--muted)}
#shType{grid-auto-flow:row; grid-template-columns:repeat(3,1fr)}
textarea.inp{resize:vertical; font-size:13px}

/* ---- оформление: акценты, обои, цвета карт ---- */
:root[data-theme="light"][data-accent="blue"]{--accent:#2B5FD9; --accent-fg:#FFFFFF; --accent-soft:#DCE6FB; --save:#2B5FD9}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7FA6F5; --accent-fg:#0A1A3D; --accent-soft:#1A2A4F; --save:#7FA6F5}
:root[data-theme="light"][data-accent="violet"]{--accent:#7040C8; --accent-fg:#FFFFFF; --accent-soft:#E4DBF6; --save:#7040C8}
:root[data-theme="dark"][data-accent="violet"]{--accent:#B497F0; --accent-fg:#1E0F40; --accent-soft:#2E2150; --save:#B497F0}
:root[data-theme="light"][data-accent="orange"]{--accent:#C2570C; --accent-fg:#FFFFFF; --accent-soft:#FBE3D0; --save:#C2570C}
:root[data-theme="dark"][data-accent="orange"]{--accent:#F0954F; --accent-fg:#3A1A04; --accent-soft:#4A2B12; --save:#F0954F}
:root[data-theme="light"][data-accent="rose"]{--accent:#C2335E; --accent-fg:#FFFFFF; --accent-soft:#F8D9E3; --save:#C2335E}
:root[data-theme="dark"][data-accent="rose"]{--accent:#F27CA0; --accent-fg:#3D0A1E; --accent-soft:#4A1B2D; --save:#F27CA0}
:root[data-theme="light"][data-accent="graphite"]{--accent:#3A4650; --accent-fg:#FFFFFF; --accent-soft:#E2E6EA; --save:#3A4650}
:root[data-theme="dark"][data-accent="graphite"]{--accent:#AEB9C2; --accent-fg:#12181D; --accent-soft:#2A3238; --save:#AEB9C2}
:root[data-theme]{--hero-track:color-mix(in srgb,var(--accent-fg) 28%,transparent); --hero-fill:var(--accent-fg); --hero-sub:color-mix(in srgb,var(--accent-fg) 82%,transparent)}
#wall{position:fixed; inset:0; z-index:-1; background-size:cover; background-position:center}
#wall::after{content:""; position:absolute; inset:0; background:color-mix(in srgb,var(--bg) var(--wdim,35%),transparent)}
html[data-wall]{background:var(--bg)}
html[data-wall] body{background:transparent}
html[data-wall] .card, html[data-wall] .iconbtn{background:color-mix(in srgb,var(--surface) 78%,transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
html[data-wall] #nav{background:color-mix(in srgb,var(--surface) 86%,transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.tag.acc{background:color-mix(in srgb,var(--c) 20%,transparent); color:var(--fg); box-shadow:inset 3px 0 0 var(--c); padding-left:9px}
.cd{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:baseline; flex:none}
.chip.accchip.on{border-color:var(--c); background:color-mix(in srgb,var(--c) 22%,var(--surface)); color:var(--fg)}
.swatches{display:flex; gap:10px; flex-wrap:wrap}
.sw{width:36px; height:36px; border-radius:50%; background:var(--c); border:3px solid transparent; box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--surface); box-shadow:0 0 0 2px var(--fg)}
input[type=range]{width:100%; accent-color:var(--accent)}
.filebtn{position:relative; overflow:hidden}
.filebtn input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer}

/* ---- школа финансов ---- */
.ck{width:26px; height:26px; border-radius:8px; border:2px solid var(--line); display:grid; place-items:center; flex:none; color:var(--accent-fg); font-size:15px; line-height:1; background:var(--surface)}
.ck.on{background:var(--accent); border-color:var(--accent)}
.tip{display:flex; flex-direction:column; gap:10px; padding:14px 0; border-top:1px solid var(--line)}
.tip:first-child{border-top:0; padding-top:4px}
.tiphead{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%}
.tiphead .tt{flex:1; min-width:0}
.tipbody{display:flex; flex-direction:column; gap:10px; margin-left:38px}
.tipbody .how{background:var(--accent-soft); border-radius:12px; padding:10px 12px; font-size:14px}
.stepno{width:26px; height:26px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font-size:13px; font-weight:600; flex:none}
.stepno.done{background:var(--good); color:#fff}
.stepno.now{background:var(--accent); color:var(--accent-fg)}
.progress{font-size:13px; color:var(--muted); white-space:nowrap}
.wishform{display:grid; grid-template-columns:1fr 110px; gap:8px}
.ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px}
a.link{text-decoration:underline; text-underline-offset:2px}

</style></head><body>
<main id="app"></main>
<nav id="nav" aria-label="Разделы"><div class="in">
<button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></button>
<button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>История</span></button>
<button class="add" data-open aria-label="Добавить запись"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-tab="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Бюджет</span></button>
<button data-tab="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="17" cy="14" r="1"/></svg><span>Счета</span></button>
</div></nav>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Новая запись"></div>
<div id="toast" role="status" hidden></div>
<script>
const L = (function () {
  'use strict';
  const GROUPS = { need: 'Нужды', want: 'Желания', save: 'Накопления' };
  const CATS = [
    { id: 'prod', name: 'Продукты', g: 'need', pct: 28 },
    { id: 'home', name: 'Жильё и коммуналка', g: 'need', pct: 0 },
    { id: 'trans', name: 'Транспорт', g: 'need', pct: 5 },
    { id: 'conn', name: 'Связь и интернет', g: 'need', pct: 2 },
    { id: 'health', name: 'Здоровье', g: 'need', pct: 3 },
    { id: 'study', name: 'Учёба', g: 'need', pct: 2 },
    { id: 'people', name: 'Переводы людям', g: 'need', pct: 8 },
    { id: 'cafe', name: 'Кафе и доставка', g: 'want', pct: 10 },
    { id: 'shop', name: 'Одежда и покупки', g: 'want', pct: 10 },
    { id: 'subs', name: 'Подписки', g: 'want', pct: 4 },
    { id: 'fun', name: 'Развлечения', g: 'want', pct: 5 },
    { id: 'other', name: 'Прочее', g: 'want', pct: 5 },
    { id: 'cushion', name: 'Подушка безопасности', g: 'save', pct: 10 },
    { id: 'goals', name: 'Цели и инвестиции', g: 'save', pct: 8 }
  ];
  const catById = {};
  CATS.forEach(function (c) { catById[c.id] = c; });

  // Все суммы хранятся в копейках (целые числа).
  const ACC_COLORS = ['#2E9E83', '#3D7BE0', '#8A5CD6', '#E0802E', '#D9436F', '#D9A441', '#4F5B66', '#2BA6C4'];
  const ACCENTS = ['green', 'blue', 'violet', 'orange', 'rose', 'graphite'];
  function defaultAccounts() {
    return [
      { id: 'main', name: 'Основная карта', kind: 'debit', start: 0, cashback: 0, round: true, color: ACC_COLORS[0] },
      { id: 'cash', name: 'Наличные', kind: 'cash', start: 0, cashback: 0, round: false, color: ACC_COLORS[5] }
    ];
  }
  function defaults() {
    const pct = {};
    CATS.forEach(function (c) { pct[c.id] = c.pct; });

  topics: [
    { id: 'budget', title: 'Как делить деньги', intro: 'Правила распределения бюджета: откуда они и как подстроить под небольшой доход.', tips: [
      { id: 'b1', t: 'Считайте проценты от дохода «на руки»: аванс + зарплата + стипендия. Ориентир 50/30/20 — например, с 10 000 ₽ это 5 000 на нужды, 3 000 на желания и 2 000 на накопления. Если «Нужды» стабильно выше 50%, временно берите 60/30/10, но накопления не опускайте ниже 10%.', how: 'Доли «Нужд», «Желаний» и «Накоплений» в блоке «Мои показатели».', src: 'Э. Уоррен, А. Тьяги, «All Your Worth» (2005); Time, «Why a 60/30/10 Budget Could Be the New 50/30/20»', url: 'https://time.com/6916834/how-to-budget-60-30-10/' },
      { id: 'b2', t: 'Пока есть долг по кредитке, его погашение входит в «20%», а «Желания» временно снижайте до 15–20%.', how: 'Остаток долга и сумма платежей за месяц на вкладке «Счета».', src: 'Логика правила Уоррен (20% — сбережения и долги); поправка для студента — вывод автора отчёта' },
      { id: 'b3', t: 'Платите сначала себе: переводите накопления в день поступления денег, аванс и зарплату отдельно. Откладывать не меньше десятой части дохода советует Дж. Клейсон.', how: 'Дата записи «Накопления» совпадает с датой дохода; доля накоплений растёт.', src: 'Дж. Клейсон, «Самый богатый человек в Вавилоне»; портал «Молодёжь Москвы»' },
      { id: 'b4', t: 'Категории в приложении — это цифровые конверты. Перерасход в одной покрывайте за счёт другой, а не за счёт накоплений.', how: 'Число категорий с перерасходом за месяц на вкладке «Бюджет».', src: 'Метод конвертов; ментальные счета (Р. Талер, «Новая поведенческая экономика»)' }
    ] },
    { id: 'cushion', title: 'Подушка безопасности', intro: 'Сколько откладывать на чёрный день и где это хранить.', tips: [
      { id: 'c1', t: 'Посчитайте обязательные расходы месяца и ставьте ступенчатые цели: 1 месяц, затем 3, затем 6. При нестабильном доходе ориентируйтесь на верхнюю границу. В исследовании Vanguard даже небольшой запас был связан с более высоким финансовым благополучием, а 3–6 месяцев давали дополнительный эффект.', how: '«Месяцев подушки» = накопления в категории «Подушка» / средние «Нужды».', src: 'fincult.info, «Финансовая подушка безопасности»; Vanguard, Emergency savings and financial well-being (2025)', url: 'https://fincult.info/article/finansovaya-podushka-bezopasnosti-chto-eto-takoe-i-zachem-ona-nuzhna/' },
      { id: 'c2', t: 'Храните подушку отдельно от карты для трат: на накопительном счёте или коротком вкладе с пополнением. Банк должен входить в систему страхования вкладов.', how: 'Подушка лежит на отдельном счёте, банк есть в реестре АСВ.', src: 'fincult.info; АСВ', url: 'https://finuslugi.ru/navigator/nakopit-i-sohranit/stat_agentstvo-po-strakhovaniyu-vkladov-limity-vyplaty-i-chto-zastrakhovano' },
      { id: 'c3', t: 'Подушка — не инвестиции. Брокерский счёт и ИИС не застрахованы АСВ, поэтому подушку там держать нельзя.', how: 'Подушка не смешана с инвестиционным счётом.', src: 'Обзор системы страхования вкладов (bankiros.ru)' },
      { id: 'c4', t: 'Копилку округлений направляйте в подушку, пока не набран первый месяц расходов: «невидимые» отчисления работают на самую важную цель.', how: 'Сумма округлений за месяц на вкладке «Счета».', src: 'Вывод автора на основе принципа автоматизации (Талер и Бенарци, Save More Tomorrow)' }
    ] },
    { id: 'credit', title: 'Кредитка и долги', intro: 'Как пользоваться льготным периодом и не попасть на проценты.', tips: [
      { id: 'k1', t: 'Запишите дату конца льготного периода и сумму полного погашения. Платите на 2–3 дня раньше срока: зачисление может задержаться.', how: 'Дни до конца срока и долг на вкладке «Счета».', src: 'fincult.info, «Как выбрать кредитную карту»; Финуслуги', url: 'https://fincult.info/article/vybiraem-kreditnuyu-kartu/' },
      { id: 'k2', t: 'Не снимайте наличные и не переводите деньги с кредитки: льготный период на эти операции обычно не действует, а комиссия может быть 3–5,9% плюс фиксированная сумма.', how: 'Число таких операций за месяц — ноль.', src: 'fincult.info; Финуслуги, «Кредитная карта с льготным периодом: в чём подвох»', url: 'https://finuslugi.ru/navigator/kredity/stat_kreditnaya-karta-s-lgotnym-periodom-v-chem-podvokh-i-kakie-podvodnye-kamni-nuzhno-znat' },
      { id: 'k3', t: 'Пока долг не закрыт, новые траты по кредитке не должны превышать платежи по ней. Долг должен снижаться от месяца к месяцу.', how: 'Блок «Кредитка» в «Мои показатели»: платежи и новые покупки за месяц.', src: 'Вывод автора; принцип полного погашения — fincult.info' },
      { id: 'k4', t: 'Если долгов несколько: «лавина» (сначала самая высокая ставка) дешевле, «снежный ком» (сначала самый маленький долг) лучше держит мотивацию. В исследовании Гал и Макшейн успех больше зависел от числа закрытых долгов, чем от суммы выплат.', how: 'Число открытых долгов и переплата процентов.', src: 'Gal & McShane, «Can Small Victories Help Win the War?», JMR (2012)' },
      { id: 'k5', t: 'Чтобы не жить в долг, отключите снятие наличных с кредитки в настройках банка, а после погашения подумайте о закрытии карты.', how: 'Использование лимита к концу льготного периода — 0%.', src: 'fincult.info' }
    ] },
    { id: 'cashback', title: 'Кэшбэк и бонусы', intro: 'Как получать выгоду и не тратить лишнего.', tips: [
      { id: 'h1', t: 'Кэшбэк выгоден только на траты, которые вы сделали бы и так. Купить ненужное ради 5% — значит потерять 95%.', how: 'Кэшбэк за месяц в «Мои показатели» против лишних покупок «ради акции».', src: 'fincult.info, «Кешбэк: как получать подарки за счёт банка»', url: 'https://fincult.info/article/keshbek-kak-razvlekatsya-puteshestvovat-i-poluchat-podarki-za-schet-banka/' },
      { id: 'h2', t: 'Выбирайте категории повышенного кэшбэка по своей статистике: 2–3 самые крупные категории расходов за последние месяцы.', how: 'Совпадение категорий кэшбэка с топ-3 расходов.', src: 'Практика; вывод автора' },
      { id: 'h3', t: 'Смотрите на месячные лимиты кэшбэка, минимальный оборот и срок сгорания баллов. Если ради условия приходится превышать лимит категории, программа вам не подходит.', how: 'Дошли ли до лимита кэшбэка; сколько баллов сгорело.', src: 'Обзоры условий программ лояльности; условия своей карты' },
      { id: 'h4', t: 'Не держите несколько карт «на всякий случай»: растёт риск платы за обслуживание и путаницы. Полученный кэшбэк сразу отправляйте в накопления.', how: 'Число карт с платным обслуживанием.', src: 'Вывод автора' }
    ] },
    { id: 'psych', title: 'Импульсные покупки', intro: 'Как психология влияет на траты и что с этим делать.', tips: [
      { id: 'p1', t: 'Правило паузы: необязательную покупку от 3 000 ₽ откладывайте на 24 часа, от 10 000 ₽ — на 72 часа. Сначала она попадает в «Список желаний» ниже.', how: 'Число отказов после паузы и сэкономленная сумма в блоке «Список желаний».', src: 'Популярная эвристика (строгих исследований именно про 24/72 часа не найдено); механизм — Д. Канеман, «Думай медленно… решай быстро»', w: 1 },
      { id: 'p2', t: '«Боль платежа»: чем прозрачнее оплата, тем меньше хочется тратить. На категории, где часто срываетесь (кафе, доставка), выделите недельную сумму наличными или отдельной дебетовой картой.', how: 'Траты в проблемной категории до и после, остаток недельного «конверта».', src: 'Prelec & Loewenstein (1998); Raghubir & Srivastava (2008); APA, «Credit cards vs cash»', url: 'https://www.apa.org/news/press/releases/2008/09/credit-cash' },
      { id: 'p3', t: 'Не превращайте «эффект латте» в самобичевание: расчёты Бака завышены. Берите из идеи главное — замечайте частые мелкие траты и считайте их за месяц.', how: 'Сумма мелких покупок (до 500 ₽) и доставки за месяц.', src: 'D. Bach, «The Latte Factor»; критика — Forbes (2017)', url: 'https://summitward.com/learn/latte-factor-recalculated' },
      { id: 'p4', t: 'Доставку еды выделите в отдельный недельный лимит, а не «Продукты»: так видна реальная цена удобства.', how: 'Число заказов в неделю и средний чек.', src: 'Вывод автора на основе ментальных счетов (Талер)' },
      { id: 'p5', t: 'Деньги — про поведение, а не про формулы. Оставляйте запас на ошибку и не равняйтесь на чужое потребление.', how: 'Доля «Желаний» относительно плана; свободный остаток в конце месяца.', src: 'М. Хаузел, «Психология денег» (общая идея книги)' }
    ] },
    { id: 'subs', title: 'Подписки и регулярные платежи', intro: 'Незаметные списания, которые съедают бюджет.', tips: [
      { id: 's1', t: 'Раз в квартал выписывайте все автосписания (музыка, видео, облако, связь, приложения) и отменяйте то, чем не пользовались 30 дней. На пробный период ставьте напоминание за 2 дня до автопродления.', how: 'Число подписок и их сумма в «Мои показатели»; дата последнего аудита не старше 90 дней.', src: 'Prelec & Loewenstein (1998); периодичность — практическая рекомендация' },
      { id: 's2', t: 'Считайте подписки в год: 399 ₽ в месяц — это 4 788 ₽ в год. Годовая цифра лучше показывает реальную цену.', how: 'Годовая стоимость подписок в «Мои показатели».', src: 'Вывод автора (переформулирование по Канеману и Талеру)' },
      { id: 's3', t: 'Обязательные платежи (связь, проезд, жильё) закрывайте автоплатежом сразу после зарплаты, чтобы они не конкурировали с «Желаниями».', how: 'Все постоянные «Нужды» стоят на автоплатеже.', src: 'Принцип автоматизации (Thaler & Benartzi, 2004)' }
    ] },
    { id: 'invest', title: 'Накопления и инвестиции', intro: 'С чего начать новичку. Это общие принципы, а не личная рекомендация.', tips: [
      { id: 'i1', t: 'Перед инвестициями проверьте три условия: долг по кредитке равен нулю, подушка не меньше 3 месяцев, у цели есть срок. Инвестируйте только деньги, которые не понадобятся минимум 3–5 лет.', how: 'Блок «План по порядку»: шаги 1–3 выполнены.', src: 'fincult.info; Б. Грэм, «Разумный инвестор» (общая идея)' },
      { id: 'i2', t: 'Вклад или накопительный счёт: держите не больше 1,4 млн ₽ в одном банке вместе с процентами. Проценты по вкладам за 2026 год не облагаются НДФЛ в пределах 160 000 ₽.', how: 'Остаток в каждом банке и проценты за год.', src: 'АСВ; Коммерсантъ, Клерк', url: 'https://finuslugi.ru/navigator/nakopit-i-sohranit/stat_agentstvo-po-strakhovaniyu-vkladov-limity-vyplaty-i-chto-zastrakhovano' },
      { id: 'i3', t: 'ИИС-3 даёт вычет 13% с взносов до 400 000 ₽ в год (если вы платите НДФЛ). Счёт, открытый в 2024–2026 годах, нужно держать минимум 5 лет. Деньги на ИИС не застрахованы АСВ.', how: 'Взносы за год × 13% = ожидаемый вычет; дата, когда счёт можно закрыть без потери льгот.', src: 'Финуслуги, «ИИС-3 в 2026 году»', url: 'https://finuslugi.ru/navigator/investirovat/stat_iis_3_vychety_i_strakhovanie_na_14_mln_r' },
      { id: 'i4', t: 'Диверсифицируйте: не держите всё в одной бумаге или секторе, выбирайте простые понятные инструменты. У акций и облигаций нет гарантии АСВ, и они могут упасть в цене.', how: 'Доля самой крупной позиции (сигнал, если больше 20–25%).', src: 'Б. Грэм, «Разумный инвестор» (общая идея); базовый принцип диверсификации' },
      { id: 'i5', t: 'Признаки пирамиды: «гарантированная» высокая доходность, бонусы за приведённых друзей, агрессивная реклама, нет лицензии ЦБ. Брокера и банк проверяйте в Справочнике финансовых организаций на cbr.ru.', how: 'У каждого банка и брокера отмечено «лицензия проверена».', src: 'Банк России, «Признаки финансовой пирамиды»', url: 'https://www.cbr.ru/faq/pnp/' }
    ] },
    { id: 'fraud', title: 'Защита от мошенников', intro: 'Самые частые схемы и простые меры защиты.', tips: [
      { id: 'f1', t: 'Оформите самозапрет на кредиты и займы на Госуслугах (действует с 1 марта 2025 года). Быстро снять его нельзя: после заявки действует «период охлаждения».', how: 'Статус «самозапрет установлен».', src: 'Банк России; ОКБ', url: 'https://ulus.media/2026/09/11/samozapret-na-kredity-v-2026-godu-chto-nuzhno-znat-kazhdomu/' },
      { id: 'f2', t: 'Банк и ЦБ никогда не просят назвать код из SMS, перевести деньги на «безопасный счёт» или оформить кредит. Кладите трубку и перезванивайте по номеру с обратной стороны карты.', how: 'Вы знаете эти правила и рассказали их близким.', src: 'Банк России' },
      { id: 'f3', t: 'Поставьте суточные лимиты на переводы и снятие наличных в банковских приложениях. Для карты с крупным остатком отключите онлайн-платежи.', how: 'Лимиты установлены на каждой карте.', src: 'Рекомендации банков и Банка России' },
      { id: 'f4', t: 'Паузы банка — защита, а не помеха: подозрительные переводы могут приостановить, а крупный кредит выдать с задержкой. Если собеседник просит «обойти» паузу или торопит, это почти наверняка мошенник.', how: 'Срочность и секретность — красные флаги.', src: 'Банк России; обзоры мер против мошенников', url: 'https://brobank.ru/podvodnyt-kamni-samozapreta/' }
    ] },
    { id: 'habits', title: 'Привычки и самоконтроль', intro: 'Как сделать так, чтобы правила работали без силы воли.', tips: [
      { id: 'a1', t: 'Автоматизируйте: в дни аванса и зарплаты — автоперевод на накопления, при росте дохода сразу добавляйте 1–2 процентных пункта к доле накоплений. В программе Save More Tomorrow норма сбережений участников выросла с 3,5% до 13,6% за 40 месяцев.', how: 'Автоперевод настроен; доля накоплений по месяцам растёт.', src: 'Thaler & Benartzi, JPE (2004); Талер, Санстейн, «Nudge». Оговорка: причинная доказательность оценена как низкая (CLEAR, Минтруд США)', url: 'https://clear.dol.gov/study/save-more-tomorrow%E2%84%A2-using-behavioral-economics-increase-employee-saving-thaler-benartzi-2004' },

(function () {
  'use strict';
  const $ = function (s) { return document.querySelector(s); };
  const app = $('#app'), sheet = $('#sheet'), toastEl = $('#toast');
  let state = { settings: L.withDefaults(null), months: {} };
  let ui = { tipTopic: null, tipOpen: null, tab: 'home', month: L.monthOf(L.dateStr(new Date())), edit: false, creditEdit: false, sel: null, del: null, accEdit: null, accDel: null };
  let ready = false, mode = 'memory', persistOk = true, sh = null, pendingRender = false, toastT = null;

  /* ---------- форматирование ---------- */
  const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function fmt(k, dec) {
    const neg = k < 0, a = Math.abs(k);
    const s = (a % 100 === 0 && !dec) ? nf0.format(a / 100) : nf2.format(a / 100);
    return (neg ? '−' : '') + s + ' ₽';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function monthTitle(mk) {
    const p = mk.split('-').map(Number);
    return cap(new Date(p[0], p[1] - 1, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(/\s?г\.$/, ''));
  }
  function dateRu(d) { const p = d.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); }
  function dayTitle(d) { const p = d.split('-').map(Number); return cap(new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' })); }
  function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return (a > 10 && a < 20) ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, 3400);
  }
  const ico = {
    left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
  };

  /* ---------- счета ---------- */
  function accById(id) { return state.settings.accounts.filter(function (a) { return a.id === id; })[0] || null; }
  function accName(id) { if (id === 'credit') return 'Кредитка'; const a = accById(id); return a ? a.name : 'Счёт удалён'; }
  function accColor(id) {
    if (id === 'credit') return '#C0504D';
    const a = accById(id); return a && a.color ? a.color : '#7A8A83';
  }
  function accTag(id) { return '<span class="tag acc" style="--c:' + accColor(id) + '">' + esc(accName(id)) + '</span>'; }
  function defaultAcc() { const s = state.settings; return accById(s.lastAcc) ? s.lastAcc : s.accounts[0].id; }
  function otherAcc(id) { const o = state.settings.accounts.filter(function (a) { return a.id !== id; })[0]; return o ? o.id : null; }

  /* ---------- хранение ---------- */
  const Store = (function () {
    const LS = 'balans-mesyatsa-v1';
    let uid = null, profile = null, monthsCol = null, writing = 0, chain = Promise.resolve();
    let stashS = null, stashM = null, onChange = function () {}, gotS = false, gotM = false, cloudLoaded = false;

    function lsLoad() { try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
    function lsSave() {
      try { localStorage.setItem(LS, JSON.stringify({ settings: state.settings, months: state.months })); persistOk = true; }
      catch (e) { persistOk = false; }
    }
    function applySettings(snap) { const v = snap.exists ? snap.data() : null; state.settings = L.withDefaults(v); onChange(); }
    function applyMonths(qs) {
      const m = {};
      qs.docs.forEach(function (d) { const v = d.data() || {}; m[d.id] = { tx: JSON.parse(JSON.stringify(v.tx || {})) }; });
      state.months = m; onChange();
    }
    function checkReady() { if (gotS && gotM) { cloudLoaded = true; ready = true; onChange(); } }
    function fallbackLocal() {
      mode = 'local';
      if (!cloudLoaded) {
        const d = lsLoad();
        if (d) { state.settings = L.withDefaults(d.settings); state.months = d.months || {}; }
      }
      ready = true; onChange();
    }
    function flush() { const s = stashS, m = stashM; stashS = null; stashM = null; if (s) applySettings(s); if (m) applyMonths(m); }
    function enqueue(fn) {
      writing++;
      chain = chain.then(fn).catch(function () { toast('Не удалось сохранить. Проверьте соединение и повторите.'); })
        .then(function () { writing--; if (writing === 0) flush(); });
    }
    async function init(cb) {
      onChange = cb;
      let db = null, user = null;
      try {
        if (window.claude && typeof window.claude.use === 'function') {
          db = await window.claude.use('db');
          user = await window.claude.use('user');
        }
      } catch (e) { db = null; }
      if (db && user) { try { uid = await user.id(); } catch (e) { uid = null; } }
      if (db && uid) {
        try {
          mode = 'cloud';
          profile = db.doc('data/users/' + uid + '/profile');
          monthsCol = profile.collection('months');
          profile.onSnapshot(function (snap) { if (writing > 0) { stashS = snap; return; } applySettings(snap); gotS = true; checkReady(); }, fallbackLocal);
          monthsCol.onSnapshot(function (qs) { if (writing > 0) { stashM = qs; return; } applyMonths(qs); gotM = true; checkReady(); }, fallbackLocal);
          return;
        } catch (e) { /* ниже запасной вариант */ }
      }
      fallbackLocal();
    }
    function saveSettings() {
      if (mode === 'cloud') { const body = JSON.parse(JSON.stringify(state.settings)); enqueue(function () { return profile.set(body); }); }
      else lsSave();
    }
    function saveMonth(mk) {
      const body = { tx: JSON.parse(JSON.stringify((state.months[mk] && state.months[mk].tx) || {})) };
      if (mode === 'cloud') enqueue(function () { return monthsCol.doc(mk).set(body); });
      else lsSave();
    }
    return { init: init, saveSettings: saveSettings, saveMonth: saveMonth };
  })();

  function addTx(x) {
    const mk = L.monthOf(x.d);
    if (!state.months[mk]) state.months[mk] = { tx: {} };
    state.months[mk].tx[x.id] = x;
    Store.saveMonth(mk);
  }
  function delTx(id, mk) {
    if (state.months[mk] && state.months[mk].tx && state.months[mk].tx[id]) {
      const removed = state.months[mk].tx[id];
      delete state.months[mk].tx[id];
      if (!L.savingsLedgerValid(state.months)) {
        state.months[mk].tx[id] = removed;
        toast('Нельзя удалить запись: после неё снятия превысят доступные накопления.');
        return false;
      }
      Store.saveMonth(mk);
      return true;
    }
    return false;
  }

  /* ---------- общие куски разметки ---------- */
  function monthBar(mk) {
    return '<div class="mswitch"><button class="iconbtn" data-a="m-" aria-label="Предыдущий месяц">' + ico.left + '</button>' +
      '<h1>' + esc(monthTitle(mk)) + '</h1>' +
      '<button class="iconbtn" data-a="m+" aria-label="Следующий месяц">' + ico.right + '</button></div>';
  }
  function txInfo(x) {
    let title, dot, amt = '', cls = '', sub = x.n ? esc(x.n) : '';
    const dec = x.a % 100 !== 0, acc = L.accOf(x);
    if (x.t === 'e') { const c = L.catById[x.c]; title = c ? c.name : 'Расход'; dot = c ? c.g : 'want'; amt = fmt(-x.a, dec); }
    else if (x.t === 'i') { title = x.reg ? (x.n || 'Регулярный доход') : 'Разовый доход'; if (x.reg) sub = ''; dot = 'inc'; amt = '+' + fmt(x.a, dec); cls = ' in'; }
    else if (x.t === 'p') { title = 'Погашение кредитки'; dot = 'pay'; amt = fmt(-x.a, dec); }
    else if (x.t === 't') { title = 'Перевод'; dot = 'xfer'; amt = fmt(x.a, dec); }
    else if (x.t === 'w') { const c = L.catById[x.c]; title = 'Снятие: ' + (c ? c.name.toLowerCase() : 'накопления'); dot = 'save'; amt = '+' + fmt(x.a, dec); cls = ' in'; }
    else { const c = L.catById[x.c]; title = c ? c.name : 'Накопления'; dot = 'save'; amt = '→ ' + fmt(x.a, dec); }
    if (x.t === 't') sub += ' ' + accTag(acc) + ' → ' + accTag(x.to);
    else sub += ' ' + accTag(acc);
    if (x.t === 'e' && x.r > 0) sub += ' <span class="tag soft">+' + fmt(x.r, x.r % 100 !== 0) + ' в копилку</span>';
    return { title: title, dot: dot, amt: amt, cls: cls, sub: sub };
  }
  function rowHtml(x, interactive) {
    const i = txInfo(x);
    const inner = '<span class="dot ' + i.dot + '"></span><span class="main"><span class="t">' + esc(i.title) + '</span>' +
      '<span class="small muted">' + i.sub + '</span></span><span class="amt num' + i.cls + '">' + i.amt + '</span>';
    if (!interactive) return '<div class="row">' + inner + '</div>';
    let h = '<button class="row" data-a="sel" data-id="' + esc(x.id) + '" data-mk="' + esc(L.monthOf(x.d)) + '">' + inner + '</button>';
    if (ui.sel === x.id) {
      if (ui.del === x.id) h += '<div class="actions"><span class="small" style="align-self:center">Удалить запись?</span><button class="btn danger sm" data-a="delyes" data-id="' + esc(x.id) + '" data-mk="' + esc(L.monthOf(x.d)) + '">Да, удалить</button><button class="btn ghost sm" data-a="delno">Отмена</button></div>';
      else h += '<div class="actions"><button class="btn ghost sm" data-a="del" data-id="' + esc(x.id) + '">Удалить</button></div>';
    }
    return h;
  }

  /* ---------- экраны ---------- */
  function setupCard() {
    return '<section class="card"><h2>Быстрая настройка</h2><div class="small muted">Введите доход, остатки и долг по кредитке, чтобы появились лимиты. Данные остаются только на этом телефоне.</div>' +
      '<div class="field"><label for="su-sal">Зарплата в месяц, ₽</label><input id="su-sal" class="inp num" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label for="su-st">Стипендия, ₽</label><input id="su-st" class="inp num" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label for="su-ex">Другой регулярный доход, ₽</label><input id="su-ex" class="inp num" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label for="su-card">Сейчас на основной карте, ₽</label><input id="su-card" class="inp num" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label for="su-cash">Наличных сейчас, ₽</label><input id="su-cash" class="inp num" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label for="su-cb">Долг по кредитке, ₽ (если есть)</label><input id="su-cb" class="inp num" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label for="su-cd">Закрыть кредитку до</label><input id="su-cd" class="inp" type="date"></div>' +
      '<div class="err" id="suErr" role="alert"></div>' +
      '<button class="btn primary block" data-a="setup">Сохранить</button><button class="link small" data-a="skipsetup">Пропустить</button></section>';
  }

  function viewHome() {
    const s = state.settings, mk = ui.month, today = L.dateStr(new Date()), cur = L.monthOf(today);
    const c = L.calcMonth(state.months, s, mk), cs = L.creditStats(state.months, s, today);
    const isNow = mk === cur, dim = L.daysIn(mk), dayNow = Number(today.slice(8, 10));
    const remaining = c.spendPlan - c.spentTotal;
    const daysLeft = isNow ? dim - dayNow + 1 : 0;
    const perDay = (isNow && remaining > 0 && daysLeft > 0) ? Math.floor(remaining / daysLeft / 100) * 100 : 0;
    const ratio = c.spendPlan > 0 ? Math.min(1, c.spentTotal / c.spendPlan) : (c.spentTotal > 0 ? 1 : 0);
    const pace = (isNow && c.spendPlan > 0) ? Math.min(1, dayNow / dim) : null;

    let h = monthBar(mk);
    if (!s.setupDone && c.income === 0) h += setupCard();
    h += '<section class="hero"><div class="label">' + (isNow ? 'Можно потратить до конца месяца' : 'Остаток по лимитам') + '</div>';
    h += '<div class="big num' + (remaining < 0 ? ' neg' : '') + '">' + fmt(remaining) + '</div>';
    if (remaining < 0) h += '<div class="sub">Расходы превысили лимиты месяца</div>';
    else if (isNow && c.spendPlan > 0) h += '<div class="sub num">из ' + fmt(c.spendPlan) + ' · по ' + fmt(perDay) + ' в день</div>';
    else if (c.spendPlan > 0) h += '<div class="sub num">из ' + fmt(c.spendPlan) + '</div>';
    else h += '<div class="sub">На этот месяц нет свободных денег по плану</div>';
    h += '<div class="track" role="img" aria-label="Потрачено ' + Math.round(ratio * 100) + '% лимитов"><div class="fill" style="width:' + (ratio * 100).toFixed(1) + '%"></div>' +
      (pace != null ? '<div class="tick" style="left:calc(' + (pace * 100).toFixed(1) + '% - 1px)" title="Где вы должны быть сегодня"></div>' : '') + '</div>';
    h += '<div class="sub num">Потрачено ' + fmt(c.spentTotal) + (c.spendPlan > 0 ? ' из ' + fmt(c.spendPlan) : '') + (pace != null ? ' · черта — норма на сегодня' : '') + '</div>';
    if (c.reserve > 0) h += '<div class="sub num">Отложено на кредитку в этом месяце: ' + fmt(c.reserve, true) + '</div>';
    h += '</section>';

    // счета и наличные
    const bals = s.accounts.map(function (a) { return { a: a, b: L.accountBalance(state.months, a) }; });
    if (bals.some(function (x) { return x.b !== 0; })) {
      let total = 0;
      h += '<button class="card" data-a="go:accounts" style="text-align:left"><span class="label">Деньги сейчас</span>';
      bals.forEach(function (x) {
        total += x.b;
        h += '<span class="formrow"><span><i class="cd" style="background:' + accColor(x.a.id) + '"></i>' + esc(x.a.name) + '</span><b class="num">' + fmt(x.b, x.b % 100 !== 0) + '</b></span>';
      });
      if (bals.length > 1) h += '<span class="formrow" style="border-top:1px solid var(--line);padding-top:10px"><span class="muted">Всего</span><b class="num">' + fmt(total, total % 100 !== 0) + '</b></span>';
      h += '</button>';
    }

    // карточки: кредитка и копилка
    let cdSub;
    if (cs.debt <= 0) cdSub = 'Долг закрыт';
    else if (cs.days == null) cdSub = 'Срок не задан';
    else if (cs.days < 0) cdSub = 'Срок прошёл ' + dateRu(cs.due);
    else if (cs.days === 0) cdSub = 'Сегодня последний день';
    else cdSub = 'до ' + dateRu(cs.due) + ' · ' + cs.days + ' ' + plural(cs.days, ['день', 'дня', 'дней']);
    h += '<div class="grid2">';
    h += '<button class="card" data-a="go:accounts" style="text-align:left"><span class="label">Кредитка</span><span class="stat num' + ((cs.days != null && cs.days < 0 && cs.debt > 0) ? ' bad' : '') + '">' + (cs.debt > 0 ? fmt(cs.debt, true) : '0 ₽') + '</span><span class="small muted">' + cdSub + '</span></button>';
    h += '<button class="card" data-a="go:accounts" style="text-align:left"><span class="label">Копилка округлений</span><span class="stat num">' + fmt(c.round) + '</span><span class="small muted num">за месяц · всего ' + fmt(L.totalRound(state.months)) + '</span></button>';
    h += '</div>';

    // предупреждения
    const alerts = [];
    L.CATS.forEach(function (cat) {
      if (cat.g === 'save') return;
      const st = L.status(c.spent[cat.id] || 0, c.plan[cat.id]);
      if (st.k === 'bad' || st.k === 'warn') alerts.push('<span class="pill ' + st.k + '">' + esc(cat.name) + ' · ' + st.t.toLowerCase() + '</span>');
    });
    if (alerts.length) h += '<section class="card"><h2>Обратите внимание</h2><div class="alerts">' + alerts.join('') + '</div></section>';

    // совет дня
    const rules = TIPS.rules, rule = rules[Math.floor(Date.now() / 86400000) % rules.length];
    h += '<section class="card"><div class="grouphead"><h2>Совет дня</h2><button class="link small" data-a="go:tips">Школа финансов</button></div><div>' + esc(rule) + '</div></section>';

    // последние записи
    h += '<section class="card"><div class="grouphead"><h2>Последние записи</h2><button class="link small" data-a="go:history">Вся история</button></div>';
    if (!c.txs.length) h += '<div class="empty">В этом месяце записей пока нет.<br>Нажмите «+», чтобы добавить первую трату.</div>';
    else h += '<div class="list">' + c.txs.slice(0, 6).map(function (x) { return rowHtml(x, false); }).join('') + '</div>';
    h += '</section>';
    return h;
  }

  function viewHistory() {
    const mk = ui.month, c = L.calcMonth(state.months, state.settings, mk);
    let h = monthBar(mk);
    h += '<section class="card"><div class="grid2"><div><div class="label">Расходы</div><div class="stat num">' + fmt(c.spentTotal) + '</div></div>' +
      '<div><div class="label">Чистое изменение накоплений</div><div class="stat num">' + fmt(c.saveTotal + c.round) + '</div></div></div>' +
      (c.oneOff > 0 ? '<div class="small muted num">Разовые доходы: +' + fmt(c.oneOff) + '</div>' : '') + '</section>';
    if (!c.txs.length) return h + '<div class="empty">Записей за этот месяц нет.</div>';
    const byDay = {};
    c.txs.forEach(function (x) { (byDay[x.d] = byDay[x.d] || []).push(x); });
    Object.keys(byDay).sort().reverse().forEach(function (d) {
      h += '<section class="card"><h3 class="daytitle">' + esc(dayTitle(d)) + '</h3><div class="list">' + byDay[d].map(function (x) { return rowHtml(x, true); }).join('') + '</div></section>';
    });
    return h;
  }

  function catRow(cat, fact, plan) {
    let st, figsR;
    if (cat.g === 'save') {
      st = fact < 0 ? { k: 'warn', t: 'Снятие' } : plan > 0 && fact >= plan ? { k: 'good', t: 'Цель выполнена' } : fact > 0 ? { k: 'idle', t: 'В процессе' } : { k: 'idle', t: '—' };
      figsR = fact < 0 ? 'снято сверх пополнений ' + fmt(-fact) : (plan > fact ? 'осталось отложить ' + fmt(plan - fact) : (plan > 0 ? 'выполнено' : 'лимит не задан'));
    } else {
      st = L.status(fact, plan);
      figsR = plan > 0 ? (fact <= plan ? 'осталось ' + fmt(plan - fact) : 'сверх лимита ' + fmt(fact - plan)) : 'лимит не задан';
    }
    const ratio = plan > 0 ? Math.max(0, Math.min(1, fact / plan)) : (fact > 0 ? 1 : 0);
    const factLabel = cat.g === 'save' ? (fact < 0 ? 'Чистый отток ' + fmt(-fact) : 'Отложено ' + fmt(fact)) : 'Потрачено ' + fmt(fact);
    return '<div class="cat"><div class="head"><span class="n"><span class="dot ' + cat.g + '"></span>' + esc(cat.name) + '</span><span class="pill ' + st.k + '">' + st.t + '</span></div>' +
      '<div class="track"><div class="fill ' + (st.k === 'idle' ? '' : st.k) + '" style="width:' + (ratio * 100).toFixed(1) + '%"></div></div>' +
      '<div class="figs num"><span>' + factLabel + ' из ' + fmt(plan) + '</span><span>' + figsR + '</span></div></div>';
  }

  function viewBudget() {
    const s = state.settings, mk = ui.month, c = L.calcMonth(state.months, s, mk);
    let h = monthBar(mk);
    h += '<button class="card" data-a="go:tips" style="text-align:left"><span class="label">Школа финансов</span><span>Советы, показатели бюджета и список желаний</span></button>';
    h += '<section class="card"><div class="grouphead"><h2>Доход и лимиты</h2><button class="link small" data-a="edit">' + (ui.edit ? 'Готово' : 'Настроить') + '</button></div>';
    h += '<div class="formrow"><span>Доход для бюджета</span><b class="num">' + fmt(c.income) + '</b></div>';
    h += '<div class="formrow"><span>Плановый регулярный доход</span><b class="num">' + fmt(c.plannedIncome) + '</b></div>';
    if (c.reserve > 0) h += '<div class="formrow"><span>Отложено на кредитку</span><b class="num">−' + fmt(c.reserve, true) + '</b></div>';
    h += '<div class="formrow"><span>Уже получено регулярно</span><b class="num">' + fmt(c.received) + '</b></div>';
    if (c.plannedIncome > c.received) h += '<div class="formrow"><span>Ещё ожидается</span><b class="num">' + fmt(c.plannedIncome - c.received) + '</b></div>';
    h += '<div class="formrow"><span>Распределяется по лимитам</span><b class="num">' + fmt(c.available) + '</b></div>';
    if (c.reserve > 0) h += '<div class="hint warn">В этом месяце нужно закрыть кредитку, поэтому часть дохода зарезервирована под долг.</div>';
    if (c.oneOff > 0) h += '<div class="hint">Разовые доходы за месяц: +' + fmt(c.oneOff) + '. Они учтены в доступном бюджете.</div>';
    h += '</section>';

    if (ui.edit) {
      let sum = 0; L.CATS.forEach(function (cat) { sum += s.pct[cat.id] || 0; });
      h += '<section class="card"><h2>Доход (в месяц, ₽)</h2>';
      [['salary', 'Зарплата'], ['stipend', 'Стипендия'], ['extra', 'Другой регулярный доход']].forEach(function (p) {
        h += '<div class="formrow"><label for="f-' + p[0] + '">' + p[1] + '</label><input id="f-' + p[0] + '" class="inp sm num" style="width:120px" inputmode="decimal" data-f="income.' + p[0] + '" value="' + (s.income[p[0]] / 100) + '"></div>';
      });
      h += '</section><section class="card"><h2>Лимиты, % от дохода</h2>';
      L.CATS.forEach(function (cat) {
        h += '<div class="formrow"><label for="p-' + cat.id + '"><span class="dot ' + cat.g + '" style="display:inline-block;margin-right:8px"></span>' + esc(cat.name) + '</label><span><input id="p-' + cat.id + '" class="inp sm num" inputmode="numeric" data-f="pct.' + cat.id + '" value="' + (s.pct[cat.id] || 0) + '"> %</span></div>';
      });
      h += '<div class="hint ' + (sum === 100 ? 'good' : 'bad') + '">Сумма: ' + sum + '%' + (sum === 100 ? '. Всё распределено.' : '. Должно получиться 100%.') + '</div></section>';
    }

    ['need', 'want', 'save'].forEach(function (g) {
      const cats = L.CATS.filter(function (x) { return x.g === g; });
      let fact = 0, plan = 0;
      cats.forEach(function (x) { fact += (g === 'save' ? c.saved[x.id] : c.spent[x.id]) || 0; plan += c.plan[x.id]; });
      h += '<section class="card"><div class="grouphead"><h2>' + L.GROUPS[g] + '</h2><span class="small muted num">' + fmt(fact) + ' из ' + fmt(plan) + '</span></div><div>';
      cats.forEach(function (x) { h += catRow(x, (g === 'save' ? c.saved[x.id] : c.spent[x.id]) || 0, c.plan[x.id]); });
      h += '</div>';
      if (g === 'save') h += '<div class="small muted num">Округления в копилку за месяц: ' + fmt(c.round) + ' (считаются отдельно)</div>';
      h += '</section>';
    });
    return h;
  }

  function accEditor(a) {
    const id = esc(a.id), mk = L.monthOf(L.dateStr(new Date()));
    const bal = L.accountBalance(state.months, a);
    let h = '<div class="editbox">';
    h += '<div class="field"><label for="a-n-' + id + '">Название</label><input id="a-n-' + id + '" class="inp" maxlength="24" data-f="acc.' + id + '.name" value="' + esc(a.name) + '"></div>';
    h += '<div class="field"><label for="a-b-' + id + '">Остаток сейчас, ₽</label><input id="a-b-' + id + '" class="inp num" inputmode="decimal" data-f="acc.' + id + '.bal" value="' + String((bal / 100).toFixed(2)).replace('.', ',') + '"></div>';
    h += '<div class="field"><span class="lab">Цвет</span><div class="swatches">';
    L.ACC_COLORS.forEach(function (col) { h += '<button class="sw' + (a.color === col ? ' on' : '') + '" style="--c:' + col + '" aria-label="Цвет ' + col + '" data-a="acccolor" data-id="' + id + '" data-c="' + col + '"></button>'; });
    h += '</div></div>';
    if (a.kind !== 'cash') {
      h += '<div class="field"><label for="a-c-' + id + '">Кэшбэк по карте, %</label><input id="a-c-' + id + '" class="inp num" inputmode="decimal" data-f="acc.' + id + '.cb" value="' + (a.cashback || 0) + '"></div>';
      h += '<div class="formrow"><span>Округлять покупки в копилку</span><button class="switch' + (a.round ? ' on' : '') + '" role="switch" aria-checked="' + (a.round ? 'true' : 'false') + '" aria-label="Округлять покупки" data-a="accround" data-id="' + id + '"></button></div>';
      if (a.cashback > 0) h += '<div class="small muted num">Кэшбэк за этот месяц: примерно ' + fmt(L.cashbackMonth(state.months, a, mk), true) + '</div>';
    }
    if (L.accountUsed(state.months, a.id)) h += '<div class="small muted">Счёт нельзя удалить: по нему есть записи.</div>';
    else if (state.settings.accounts.length < 2) h += '<div class="small muted">Это единственный счёт, его нельзя удалить.</div>';
    else if (ui.accDel === a.id) h += '<div class="actions" style="padding:0"><span class="small" style="align-self:center">Удалить счёт?</span><button class="btn danger sm" data-a="accdelyes" data-id="' + id + '">Да, удалить</button><button class="btn ghost sm" data-a="accdelno">Отмена</button></div>';
    else h += '<div><button class="btn ghost sm" data-a="accdel" data-id="' + id + '">Удалить счёт</button></div>';
    return h + '</div>';
  }

  function viewAccounts() {
    const s = state.settings, today = L.dateStr(new Date()), cs = L.creditStats(state.months, s, today);
    const curMonth = L.monthOf(today), c = L.calcMonth(state.months, s, curMonth);
    let h = '<h1 style="font-family:var(--font-display);font-size:17px;font-weight:500;min-height:44px;display:flex;align-items:center">Счета и долги</h1>';

    // мои счета
    let total = 0;
    h += '<section class="card"><div class="grouphead"><h2>Мои счета</h2><button class="link small" data-a="accadd">+ Добавить</button></div><div class="list">';
    s.accounts.forEach(function (a) {
      const bal = L.accountBalance(state.months, a); total += bal;
      const meta = (a.kind === 'cash' ? 'наличные' : 'карта') + (a.cashback > 0 ? ' · кэшбэк ' + a.cashback + '%' : '') + (a.round ? ' · округление' : '');
      h += '<button class="row" data-a="accsel" data-id="' + esc(a.id) + '"><span class="dot" style="background:' + accColor(a.id) + '"></span><span class="main"><span class="t">' + esc(a.name) + '</span><span class="small muted">' + esc(meta) + '</span></span><span class="amt num">' + fmt(bal, bal % 100 !== 0) + '</span></button>';
      if (ui.accEdit === a.id) h += accEditor(a);
    });
    h += '</div>';
    if (s.accounts.length > 1) h += '<div class="formrow" style="border-top:1px solid var(--line);padding-top:12px"><span class="muted">Всего на счетах</span><b class="num">' + fmt(total, total % 100 !== 0) + '</b></div>';
    h += '<div class="small muted">Нажмите на счёт, чтобы поправить остаток, кэшбэк или округление. Снятие наличных и переводы между счетами записывайте через «+» → «Перевод».</div></section>';

    // кредитка
    h += '<section class="card"><div class="grouphead"><h2>Кредитка</h2><button class="link small" data-a="cedit">' + (ui.creditEdit ? 'Готово' : 'Изменить') + '</button></div>';
    h += '<div class="stat num' + ((cs.days != null && cs.days < 0 && cs.debt > 0) ? ' bad' : '') + '" style="font-size:28px">' + (cs.debt > 0 ? fmt(cs.debt, true) : '0 ₽') + '</div>';
    if (cs.debt <= 0) h += '<div class="hint good">Долг закрыт. Карту можно закрывать.</div>';
    else if (cs.days == null) h += '<div class="hint">Укажите срок погашения, чтобы видеть, сколько откладывать.</div>';
    else if (cs.days < 0) h += '<div class="hint bad">Срок ' + dateRu(cs.due) + ' прошёл. Беспроцентный период мог закончиться, погасите долг как можно скорее.</div>';
    else h += '<div class="hint ' + (cs.days <= 7 ? 'warn' : '') + '">Беспроцентный период до ' + dateRu(cs.due) + ': осталось ' + cs.days + ' ' + plural(cs.days, ['день', 'дня', 'дней']) +
      '. Чтобы успеть, откладывайте по ' + fmt(cs.perWeek) + ' в неделю.</div>';
    if (s.credit.fromSavings > 0) {
      const creditMonth = s.credit.due ? L.calcMonth(state.months, s, s.credit.due.slice(0, 7)) : c;
      const savingsAvailable = Math.max(0, L.savingsBalance(state.months));
      h += '<div class="small muted num">Из накоплений на долг учтено: ' + fmt(creditMonth.savingsCover) + ' · доступно накоплений: ' + fmt(savingsAvailable) + '</div>';
      if (savingsAvailable < s.credit.fromSavings) h += '<div class="hint warn">В накоплениях сейчас меньше суммы, указанной для покрытия кредита. Резерв рассчитан только по доступному остатку.</div>';
    }
    h += '<div class="small muted">Покупки по кредитке увеличивают долг, платежи уменьшают. Если закрываете карту, платите только с дебетовой.</div>';
    h += '<button class="btn primary block" data-a="pay">Внести платёж</button>';
    if (ui.creditEdit) {
      h += '<div class="field"><label for="f-cb">Долг сейчас, ₽</label><input id="f-cb" class="inp num" inputmode="decimal" data-f="credit.balance" value="' + String((cs.debt / 100).toFixed(2)).replace('.', ',') + '"></div>';
      h += '<div class="field"><label for="f-cd">Закрыть до</label><input id="f-cd" class="inp" type="date" data-f="credit.due" value="' + esc(s.credit.due || '') + '"></div>';
      h += '<div class="field"><label for="f-cs">Покрыть долг из накоплений, ₽</label><input id="f-cs" class="inp num" inputmode="decimal" data-f="credit.fromSavings" value="' + (s.credit.fromSavings / 100) + '"></div>';
      h += '<div class="small muted">Если вы меняете долг вручную, дальше он считается от нового значения.</div>';
    }
    h += '</section>';

    h += '<section class="card"><h2>Копилка округлений</h2><div class="grid2"><div><div class="label">За месяц</div><div class="stat num">' + fmt(c.round) + '</div></div>' +
      '<div><div class="label">Всего</div><div class="stat num">' + fmt(L.totalRound(state.months)) + '</div></div></div>';
    h += '<div class="small muted">Покупки с карты округляются вверх, разницу банк переводит в копилку. Округление включается для каждой карты отдельно: нажмите на карту в «Моих счетах».</div>';
    h += '<div class="formrow"><label for="f-rs">Округлять до</label><select id="f-rs" class="inp" style="width:120px" data-f="roundStep">';
    [1000, 5000, 10000, 50000].forEach(function (v) { h += '<option value="' + v + '"' + (s.roundStep === v ? ' selected' : '') + '>' + (v / 100) + ' ₽</option>'; });
    h += '</select></div></section>';

    h += '<section class="card"><h2>Накопления и инвестиции</h2><div class="stat num">' + fmt(L.totalSaved(state.months)) + '</div>' +
      '<div class="small muted">Остаток пополнений и округлений за вычетом снятий. Переводы между обычными счетами нейтральны; для накопления используйте отдельную запись.</div>' +
      '<button class="btn ghost block" data-a="savebtn">Добавить накопление</button></section>';

    h += lookCard();
    h += '<section class="card"><h2>Резервная копия</h2><div class="small muted">Данные хранятся только на телефоне. Скопируйте копию и сохраните в заметках, чтобы не потерять её, если удалите приложение.</div>' +
      '<button class="btn ghost block" data-a="bkcopy">Скопировать копию</button>' +
      '<textarea id="bkText" class="inp" rows="3" style="min-height:84px" placeholder="Чтобы восстановить, вставьте сюда копию"></textarea>' +
      '<button class="btn ghost block" data-a="bkrestore">Восстановить из копии</button></section>';

    let note;
    if (mode === 'cloud') note = 'Данные хранятся в вашем аккаунте Claude и доступны на всех ваших устройствах.';
    else if (persistOk) note = 'Данные хранятся только в этом браузере. Если очистить данные сайта, записи пропадут.';
    else note = 'Браузер не разрешает сохранять данные (возможно, приватный режим). После закрытия страницы записи пропадут.';
    h += '<div class="small muted" style="padding:0 4px">' + note + ' Приложение не подключено к банку: все траты вы вносите сами.</div>';
    return h;
  }


  /* ---------- школа финансов ---------- */
  function tipsHead(title, back) {
    return '<div class="mswitch"><button class="iconbtn" data-a="' + back + '" aria-label="Назад">' + ico.left + '</button><h1>' + esc(title) + '</h1><span style="width:44px"></span></div>';
  }
  function pillHtml(k, t) { return '<span class="pill ' + k + '">' + t + '</span>'; }
  function pc(v) { return v == null ? '—' : Math.round(v) + '%'; }
  function viewTips() {
    const s = state.settings;
    if (ui.tipTopic) {
      const tp = TIPS.topics.filter(function (x) { return x.id === ui.tipTopic; })[0];
      if (tp) return viewTopic(tp);
    }
    const today = L.dateStr(new Date()), mk = L.monthOf(today), hs = L.healthStats(state.months, s, mk);
    let h = tipsHead('Школа финансов', 'go:home');

    // показатели
    h += '<section class="card"><h2>Мои показатели</h2><div class="small muted">За ' + esc(monthTitle(mk).toLowerCase()) + '</div>';
    if (!(hs.base > 0)) h += '<div class="hint">Задайте доход (Бюджет → Настроить), чтобы видеть доли.</div>';
    else {
      const nk = hs.needPct <= 50 ? 'good' : hs.needPct <= 60 ? 'warn' : 'bad';
      const wk = hs.wantPct <= 30 ? 'good' : hs.wantPct <= 40 ? 'warn' : 'bad';
      const sk = hs.savePct >= 10 ? 'good' : hs.savePct >= 5 ? 'warn' : 'bad';
      h += '<div class="formrow"><span>Нужды <span class="small muted">до 50%</span></span><span class="num"><b>' + pc(hs.needPct) + '</b> ' + pillHtml(nk, nk === 'good' ? 'в норме' : nk === 'warn' ? 'много' : 'слишком много') + '</span></div>';
      h += '<div class="formrow"><span>Желания <span class="small muted">до 30%</span></span><span class="num"><b>' + pc(hs.wantPct) + '</b> ' + pillHtml(wk, wk === 'good' ? 'в норме' : wk === 'warn' ? 'много' : 'слишком много') + '</span></div>';
      h += '<div class="formrow"><span>Накопления <span class="small muted">от 10%</span></span><span class="num"><b>' + pc(hs.savePct) + '</b> ' + pillHtml(sk, sk === 'good' ? 'в норме' : sk === 'warn' ? 'мало' : 'очень мало') + '</span></div>';
    }
    const ck = hs.cushMonths >= 3 ? 'good' : hs.cushMonths >= 1 ? 'warn' : 'idle';
    h += '<div class="formrow"><span>Подушка <span class="small muted">цель 3–6 мес.</span></span><span class="num"><b>' + (Math.round(hs.cushMonths * 10) / 10).toString().replace('.', ',') + ' мес.</b> ' + pillHtml(ck, ck === 'good' ? 'есть' : ck === 'warn' ? 'в процессе' : 'нет') + '</span></div>';
    if (hs.debt > 0 || hs.paid > 0 || hs.creditBuys > 0) {
      const dk = hs.creditBuys > hs.paid ? 'bad' : 'good';
      h += '<div class="formrow"><span>Кредитка: платежи и покупки</span><span class="num"><b>' + fmt(hs.paid) + ' / ' + fmt(hs.creditBuys) + '</b> ' + pillHtml(dk, dk === 'good' ? 'долг снижается' : 'долг растёт') + '</span></div>';
    }
    h += '<div class="formrow"><span>Подписки в месяц</span><span class="num"><b>' + fmt(hs.subs) + '</b> <span class="small muted">' + fmt(hs.subs * 12) + ' в год</span></span></div>';
    h += '<div class="formrow"><span>Кэшбэк за месяц</span><b class="num">' + fmt(hs.cashback, true) + '</b></div>';
    h += '</section>';

    // план по порядку
    const steps = [
      ['Закрыть кредитку', hs.debt <= 0, hs.debt > 0 ? 'Осталось ' + fmt(hs.debt, true) : 'Долга нет'],
      ['Подушка на 1 месяц расходов', hs.cushMonths >= 1, 'Сейчас ' + (Math.round(hs.cushMonths * 10) / 10).toString().replace('.', ',') + ' мес.'],
      ['Подушка на 3 месяца', hs.cushMonths >= 3, 'Потом можно до 6 месяцев'],
      ['Откладывать от 10% дохода', hs.savePct != null && hs.savePct >= 10, 'Сейчас ' + pc(hs.savePct)],
      ['Инвестиции из свободных денег', false, '']
    ];
    const first = steps.findIndex(function (x, i) { return i < 4 && !x[1]; });
    steps[4][1] = first === -1;
    steps[4][2] = first === -1 ? 'Можно начинать с малого, читайте тему «Накопления и инвестиции»' : 'Пока рано: сначала шаги 1–3';
    h += '<section class="card"><h2>План по порядку</h2><div class="list">';
    steps.forEach(function (x, i) {
      const cls = x[1] ? 'done' : (i === first ? 'now' : '');
      h += '<div class="row"><span class="stepno ' + cls + '">' + (x[1] ? '✓' : (i + 1)) + '</span><span class="main"><span class="t">' + esc(x[0]) + '</span><span class="small muted">' + esc(x[2]) + '</span></span>' + (i === first ? pillHtml('warn', 'сейчас') : '') + '</div>';
    });
    h += '</div></section>';

    // список желаний
    h += wishCard();

    // золотые правила
    h += '<section class="card"><h2>Золотые правила</h2><ol class="ol">';
    TIPS.rules.forEach(function (r) { h += '<li>' + esc(r) + '</li>'; });
    h += '</ol></section>';

    // темы
    h += '<section class="card"><h2>Темы</h2><div class="list">';
    TIPS.topics.forEach(function (tp) {
      const done = tp.tips.filter(function (x) { return s.tips[x.id]; }).length;
      h += '<button class="row" data-a="topic" data-id="' + tp.id + '"><span class="main"><span class="t">' + esc(tp.title) + '</span><span class="small muted">' + esc(tp.intro) + '</span></span><span class="progress num">' + done + ' из ' + tp.tips.length + '</span></button>';
    });

  function setWall(file) {

        const data = c.toDataURL('image/jpeg', 0.78);

  /* ---------- события ---------- */
  function applyField(f, v) {
    const s = state.settings;
    if (f.indexOf('income.') === 0) { const k = L.parseMoney(v); if (!isNaN(k)) s.income[f.slice(7)] = k; }
    else if (f.indexOf('pct.') === 0) { const n = Number(String(v).replace(',', '.')); if (!isNaN(n)) s.pct[f.slice(4)] = Math.max(0, Math.min(100, Math.round(n))); }
    else if (f === 'credit.balance') { const k = L.parseMoney(v); if (!isNaN(k)) { s.credit.balance = k; s.credit.setAt = Date.now(); } }
    else if (f === 'credit.due') { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) s.credit.due = v; }
    else if (f === 'credit.fromSavings') { const k = L.parseMoney(v); if (!isNaN(k)) s.credit.fromSavings = k; }
    else if (f === 'look.dim') { const n = Number(v); if (n >= 0 && n <= 90) s.look.dim = n; }
    else if (f === 'roundStep') { const n = Number(v); if (n > 0) s.roundStep = n; }
    else if (f.indexOf('acc.') === 0) {
      const p = f.split('.'), a = accById(p[1]);
      if (a) {
        if (p[2] === 'name') { const t = String(v).trim().slice(0, 24); if (t) a.name = t; }
        else if (p[2] === 'bal') { const k = L.parseMoney(v); if (!isNaN(k)) a.start = k - L.accountNet(state.months, a.id); }
        else if (p[2] === 'cb') { const n = Number(String(v).replace(',', '.')); if (!isNaN(n)) a.cashback = Math.max(0, Math.min(100, Math.round(n * 10) / 10)); }
      }
    }
    Store.saveSettings(); render();
  }
  app.addEventListener('change', function (e) { const f = e.target.getAttribute && e.target.getAttribute('data-f'); if (f) applyField(f, e.target.value); });
